<!-- templates\registration\password_reset_complete.html -->
{% extends "base.html" %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow border-0 p-5 d-inline-block" style="max-width: 500px;">
        <div class="text-success display-4 mb-3">
            <i class="bi bi-check-circle-fill"></i>
        </div>
        <h3 class="fw-bold">Password Reset Complete</h3>
        <p class="text-muted">
            Your password has been set successfully. You may now go ahead and log in with your new credentials.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary px-5 py-2">Log In Now</a>
    </div>
</div>
{% endblock %}
