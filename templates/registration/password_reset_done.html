<!-- templates\registration\password_reset_done.html -->
{% extends "base.html" %}
{% block content %}
<div class="container py-5 text-center">
    <div class="card shadow border-0 p-5 d-inline-block" style="max-width: 500px;">
        <div class="text-success display-4 mb-3"><i class="bi bi-envelope-check"></i></div>
        <h3 class="fw-bold">Email Bhej Diya Gaya Hai</h3>
        <p class="text-muted">Agar is email se koi account register hai, toh aapko jald hi ek link mil jayega. Apne inbox/spam folder check karein.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary mt-3">Back to Login</a>
    </div>
</div>
{% endblock %}
