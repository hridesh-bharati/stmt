<!-- templates\registration\password_reset_confirm.html -->
{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 p-4">
                <h3 class="text-primary fw-bold">Naya Password Banayein</h3>
                {% if validlink %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100 py-2">Password Save Karein</button>
                    </form>
                {% else %}
                    <div class="alert alert-danger text-center">
                        Ye link expire ho chuka hai ya invalid hai.
                    </div>
                    <a href="{% url 'password_reset' %}" class="btn btn-primary w-100">Dobara Try Karein</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
